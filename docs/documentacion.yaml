paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado de la API y MongoDB
      responses:
        '200':
          description: Servicio operativo
        '503':
          description: API activa pero base de datos desconectada

  /api/users/register:
    post:
      tags: [Usuarios]
      summary: Registrar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
        '400':
          description: Datos inválidos
        '409':
          description: Email ya registrado

  /api/users/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Credenciales inválidas

  /api/appointments:
    post:
      tags: [Turnos]
      summary: Crear un turno
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
      responses:
        '201':
          description: Turno creado
        '400':
          description: Datos inválidos
        '401':
          description: Token faltante o inválido

  /api/appointments/patient/{pId}:
    get:
      tags: [Turnos]
      summary: Obtener turnos de un paciente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pId
          required: true
          schema:
            type: string
          description: ObjectId de MongoDB del paciente
      responses:
        '200':
          description: Listado de turnos
        '400':
          description: ID de paciente inválido
        '401':
          description: Token faltante o inválido

  /api/studies:
    post:
      tags: [Estudios]
      summary: Registrar un estudio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyRequest'
      responses:
        '201':
          description: Estudio creado
        '400':
          description: Datos inválidos
        '401':
          description: Token faltante o inválido

  /api/studies/patient/{pId}:
    get:
      tags: [Estudios]
      summary: Obtener estudios de un paciente
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pId
          required: true
          schema:
            type: string
          description: ObjectId de MongoDB del paciente
      responses:
        '200':
          description: Listado de estudios
        '400':
          description: ID de paciente inválido
        '401':
          description: Token faltante o inválido

components:
  schemas:
    Address:
      type: object
      required: [number, postalCode]
      properties:
        number:
          type: string
          example: '1234'
        postalCode:
          type: string
          example: C1234ABC
        floor:
          type: string
          example: '4'
        apartment:
          type: string
          example: B

    RegisterRequest:
      type: object
      required: [name, phone, email, password, passwordConfirm, street]
      properties:
        name:
          type: string
          example: Juan Pérez
        phone:
          type: string
          example: '+54 11 5555-5555'
        email:
          type: string
          format: email
          example: juan@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: clave-segura-123
        passwordConfirm:
          type: string
          format: password
          example: clave-segura-123
        street:
          $ref: '#/components/schemas/Address'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        street:
          $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time

    AppointmentRequest:
      type: object
      required: [patientId, doctorId, date, reason]
      properties:
        patientId:
          type: string
          example: 665f1b62e4825e21f4a12345
        doctorId:
          type: string
          example: 665f1b62e4825e21f4a67890
        date:
          type: string
          format: date-time
          example: '2026-09-01T14:30:00.000Z'
        reason:
          type: string
          maxLength: 500
          example: Consulta de seguimiento

    StudyRequest:
      type: object
      required: [patientId, studyType, results, date]
      properties:
        patientId:
          type: string
          example: 665f1b62e4825e21f4a12345
        studyType:
          type: string
          example: Resonancia magnética
        results:
          type: string
          example: Informe del estudio
        date:
          type: string
          format: date-time
          example: '2026-08-20T12:00:00.000Z'
